id = "anton.sidebar"
name = "Категории и дежурства"
version = "0.6.0"
min_herdr_version = "0.9.1"
description = "Свои категории в боковой панели Spaces, вынос копий проекта из группы, пометка и проверка дежурных агентов, горячие клавиши для прыжка к проекту, звёздочки на важных проектах"
platforms = ["windows", "linux", "macos"]

[[startup]]
command = ["node", "src/ensure.js"]

[[events]]
on = "workspace.created"
command = ["node", "src/ensure.js"]

[[events]]
on = "workspace.closed"
command = ["node", "src/ensure.js"]

[[events]]
on = "workspace.moved"
command = ["node", "src/ensure.js"]

[[events]]
on = "workspace.reordered"
command = ["node", "src/ensure.js"]

[[events]]
on = "worktree.created"
command = ["node", "src/ensure.js"]

[[actions]]
id = "open"
title = "Категории и дежурства"
contexts = ["workspace"]
command = ["node", "src/cli.js", "open"]

[[actions]]
id = "ensure"
title = "Запустить помощника «Категорий и дежурств»"
command = ["node", "src/ensure.js"]

# Alt+1…Alt+4: к следующему проекту со звёздочкой этого вида.
[[actions]]
id = "star-1"
title = "Звёздочки 1: мой проект"
command = ["node", "src/cli.js", "star", "1"]

[[actions]]
id = "star-2"
title = "Звёздочки 2: первая работа"
command = ["node", "src/cli.js", "star", "2"]

[[actions]]
id = "star-3"
title = "Звёздочки 3: вторая работа"
command = ["node", "src/cli.js", "star", "3"]

[[actions]]
id = "star-4"
title = "Звёздочки 4: третья работа"
command = ["node", "src/cli.js", "star", "4"]

# F1…F4: поставить звёздочку этого вида на открытый сейчас проект или снять её.
[[actions]]
id = "star-toggle-1"
title = "Звёздочка 1 на этот проект: поставить или снять"
command = ["node", "src/cli.js", "star-toggle", "1"]

[[actions]]
id = "star-toggle-2"
title = "Звёздочка 2 на этот проект: поставить или снять"
command = ["node", "src/cli.js", "star-toggle", "2"]

[[actions]]
id = "star-toggle-3"
title = "Звёздочка 3 на этот проект: поставить или снять"
command = ["node", "src/cli.js", "star-toggle", "3"]

[[actions]]
id = "star-toggle-4"
title = "Звёздочка 4 на этот проект: поставить или снять"
command = ["node", "src/cli.js", "star-toggle", "4"]

# Alt+0: снять все звёздочки; ещё раз, пока звёздочек нет, — вернуть их.
[[actions]]
id = "star-reset"
title = "Снять все звёздочки или вернуть снятые"
command = ["node", "src/cli.js", "star-reset"]

# Горячие клавиши: config.toml связывает клавишу с действием jump-N, а что такое N,
# помощник хранит у себя (окно плагина, клавиша k). 30 мест хватит с запасом.
[[actions]]
id = "jump-1"
title = "Прыжок по горячей клавише 1"
command = ["node", "src/cli.js", "jump", "1"]

