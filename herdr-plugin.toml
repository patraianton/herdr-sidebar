# Sidebar Organizer: categories, colour stars, jump hotkeys and duty-agent alerts
# for the herdr Spaces sidebar. https://github.com/patraianton/herdr-sidebar
id = "anton.sidebar"
name = "Sidebar Organizer"
version = "0.8.0"
min_herdr_version = "0.9.1"
description = "Categories in the Spaces sidebar, colour stars with Alt+1…4, jump hotkeys, worktree detach and alerts when a 24/7 agent stops working"
platforms = ["windows", "linux", "macos"]

[[startup]]
command = ["node", "src/ensure.js"]

[[events]]
on = "workspace.created"
command = ["node", "src/ensure.js"]

[[events]]
on = "workspace.closed"
command = ["node", "src/ensure.js"]

[[events]]
on = "workspace.moved"
command = ["node", "src/ensure.js"]

[[events]]
on = "workspace.reordered"
command = ["node", "src/ensure.js"]

[[events]]
on = "worktree.created"
command = ["node", "src/ensure.js"]

[[actions]]
id = "open"
title = "Sidebar Organizer"
contexts = ["workspace"]
command = ["node", "src/cli.js", "open"]

[[actions]]
id = "ensure"
title = "Sidebar Organizer: start the helper"
command = ["node", "src/ensure.js"]

# Set up: adds the sidebar rows and the key bindings to config.toml (undo: U in the window).
[[actions]]
id = "setup"
title = "Sidebar Organizer: set up or update"
command = ["node", "src/cli.js", "setup"]

# Alt+1…Alt+4: the next project with a star of this kind.
[[actions]]
id = "star-1"
title = "Stars 1: next project with this star"
command = ["node", "src/cli.js", "star", "1"]

[[actions]]
id = "star-2"
title = "Stars 2: next project with this star"
command = ["node", "src/cli.js", "star", "2"]

[[actions]]
id = "star-3"
title = "Stars 3: next project with this star"
command = ["node", "src/cli.js", "star", "3"]

[[actions]]
id = "star-4"
title = "Stars 4: next project with this star"
command = ["node", "src/cli.js", "star", "4"]

# F1…F4: put the star of this kind on the focused project or take it off.
[[actions]]
id = "star-toggle-1"
title = "Star 1 on this project: put on or take off"
command = ["node", "src/cli.js", "star-toggle", "1"]

[[actions]]
id = "star-toggle-2"
title = "Star 2 on this project: put on or take off"
command = ["node", "src/cli.js", "star-toggle", "2"]

[[actions]]
id = "star-toggle-3"
title = "Star 3 on this project: put on or take off"
command = ["node", "src/cli.js", "star-toggle", "3"]

[[actions]]
id = "star-toggle-4"
title = "Star 4 on this project: put on or take off"
command = ["node", "src/cli.js", "star-toggle", "4"]

# Alt+0: every star off; pressed again while there are none, they come back.
[[actions]]
id = "star-reset"
title = "Stars: take all off or bring back"
command = ["node", "src/cli.js", "star-reset"]

# Jump hotkeys: config.toml binds a key to the action jump-N, and the helper keeps
# what N points at (window, key k). 30 slots is plenty.
